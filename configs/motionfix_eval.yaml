hydra:
  run:
    dir: .
  job:
    chdir: true
  output_subdir: null

# run directory holding .hydra/config.yaml and checkpoints/last.ckpt
folder: ???
ckpt_name: 'last'
last_ckpt_path: ${get_last_checkpoint:${folder},${ckpt_name}}
logger_level: INFO

# sampling
prob_way: '3way'                      # 3-way classifier-free guidance (text, motion, both)
guidance_scale_text_n_motion: 3.0     # guidance weight of the (text + source) branch
guidance_scale_motion: 3.0            # guidance weight of the source branch
num_sampling_steps: 1000              # clipped to the schedule the model was trained with (300)
init_from: 'noise'
condition_mode: 'full_cond'
field_scale: 1.0                      # inference-time strength of the preservation field (1.0 = as trained)

# evaluation loop
batch_size: 128
max_samples: null                     # stop after N motions (null = the whole evaluation set)
out_tag: ''                           # suffix appended to the output folder name

defaults:
  - _self_
  - data: motionfix
  - /path@path
  - override hydra/job_logging: rich
  - override hydra/hydra_logging: rich

split_to_load:
- "test"
- "val"
